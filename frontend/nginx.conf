# Статика интерфейса и прокси к backend (D-048).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # WebSocket: заголовки Upgrade/Connection и долгий таймаут (клиент шлёт ping раз в 15 с).
    location = /api/ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Файлы сборки с хешем в имени не меняются — их можно кешировать надолго.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Любой другой путь (/contests/5, /mail) — приложение; маршрут выбирает vue-router.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
