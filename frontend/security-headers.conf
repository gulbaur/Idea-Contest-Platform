# Заголовки безопасности для страниц и статики (D-059). Подключаются в каждом location:
# nginx не наследует add_header из server, если в location есть свой add_header.
#
# CSP: скрипты, стили, шрифты и соединения — только с этого же адреса. Главная цель —
# не дать выполниться чужому скрипту, который мог бы прочитать токен вкладки (D-003).
# 'unsafe-inline' для стилей нужен Vue: часть стилей он задаёт атрибутом style.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
